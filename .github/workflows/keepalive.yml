# Keeps a Supabase Free-plan project from pausing (7 idle days) with one RLS-filtered database read a day.
# Enable by adding the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets. Harmless when they are absent.
# GitHub disables scheduled workflows after 60 days without repository activity; re-enable from the Actions tab.
name: keepalive
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row through PostgREST
        if: ${{ secrets.SUPABASE_URL != '' }}
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/recipe_library?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" > /dev/null
          echo "pinged"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
