# Runs on every push and pull request: typecheck, lint, unit tests, production build, the SQL tenancy tests
# against a throwaway Postgres, and the Playwright flows on a Pixel 7 profile.
name: ci
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: SQL tenancy tests
        run: |
          sudo apt-get install -y -qq postgresql >/dev/null
          sudo service postgresql stop || true
          npm run db:test
      - name: Playwright flows
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
